<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#111" />
      <stop offset="25%" stop-color="#666" />
      <stop offset="50%" stop-color="#111" />
      <stop offset="75%" stop-color="#666" />
      <stop offset="100%" stop-color="#111" />
      <animate attributeName="x1" values="0%;-200%" dur="15s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;0%" dur="15s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="25%" stop-color="#aaa" />
      <stop offset="50%" stop-color="#fff" />
      <stop offset="75%" stop-color="#aaa" />
      <stop offset="100%" stop-color="#fff" />
      <animate attributeName="x1" values="0%;-200%" dur="15s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;0%" dur="15s" repeatCount="indefinite" />
    </linearGradient>
    <radialGradient id="glowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .bg-glow { fill: url(#glowLight); opacity: 0; animation: fadeIn 3s ease forwards; }
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 64px; letter-spacing: 0.12em; text-anchor: middle; fill: url(#grad1); }
    .headline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; letter-spacing: 0.05em; fill: #555; text-anchor: middle; }
    .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 16px; letter-spacing: 0.02em; fill: #777; text-anchor: middle; }
    .fade-up-1 { opacity: 0; animation: fadeUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards; }
    .fade-up-2 { opacity: 0; animation: fadeUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards; }
    .fade-up-3 { opacity: 0; animation: fadeUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards; }
    @keyframes fadeUp { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @media (prefers-color-scheme: dark) { .bg-glow { fill: url(#glowDark); } .name { fill: url(#grad2); } .headline { fill: #b0b0b0; } .subtext { fill: #888; } }
  </style>
  <rect width="100%" height="100%" class="bg-glow" />
  <g class="fade-up-1">
    <text x="400" y="90" class="name">MOEED AMIR</text>
  </g>
  <g class="fade-up-2">
    <text x="400" y="145" class="headline">Software Engineer</text>
  </g>
  <g class="fade-up-3">
    <text x="400" y="180" class="subtext">Learning and building some magic apps for real world .</text>
  </g>
</svg>
